services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: microblog
      MYSQL_ROOT_PASSWORD: password
      TZ: Asia/Manila
    restart: unless-stopped
    ports:
      - "3308:3306"
    volumes: [ db:/var/lib/mysql ]

  phpmyadmin:
    image: phpmyadmin:5-apache
    ports:
      - 8083:80
    links:
      - "db:db"
    depends_on:
      - db

  web:
    profiles: [ container-app ]
    build:
      dockerfile: Dockerfile
      context: .
      args:
        PHP_MODE: production
    depends_on: [ db ]
    ports:
      - "8000:80"  # Change from default 80 to 8000
    restart: unless-stopped
    volumes: [ ./:/var/www/html ]

  # Frontend tooling is kept out of the PHP/Apache runtime image.
  node:
    image: node:18-alpine
    working_dir: /var/www/html
    volumes: [ ./:/var/www/html ]
    profiles: [ tools ]

volumes:
  db:
