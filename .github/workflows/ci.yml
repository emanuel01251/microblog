name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.3.36
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: bcmath, curl, dom, fileinfo, mbstring, openssl, pdo, pdo_mysql, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Check PHP runtime
        run: php -v

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Check Composer platform requirements
        run: composer check-platform-reqs --no-interaction

      - name: Run Laravel tests
        run: php artisan test

      - name: Set up Node.js 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend assets
        run: npm run build
